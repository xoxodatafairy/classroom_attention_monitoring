<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cortex Classroom AI</title>
<style>
:root{--bg:#f3f5fb;--bg2:#e6eafd;--card:rgba(255,255,255,.72);--bd:rgba(99,102,241,.14);--tx:#0f172a;--mut:#64748b;--pri:#4f6ef7;--ind:#6366f1;--em:#10b981;--warn:#f59e0b;--red:#ef4444;--sh:0 8px 30px rgba(30,41,90,.08);--side:rgba(255,255,255,.8);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a0e1f;--bg2:#141a3d;--card:rgba(24,31,64,.6);--bd:rgba(129,140,248,.18);--tx:#e8ecff;--mut:#8b95b8;--sh:0 8px 30px rgba(0,0,0,.4);--side:rgba(14,19,42,.85)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a0e1f;--bg2:#141a3d;--card:rgba(24,31,64,.6);--bd:rgba(129,140,248,.18);--tx:#e8ecff;--mut:#8b95b8;--sh:0 8px 30px rgba(0,0,0,.4);--side:rgba(14,19,42,.85)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--tx);background:radial-gradient(900px 500px at 85% -10%,var(--bg2),transparent),var(--bg);min-height:100vh}
.app{display:flex;min-height:100vh}
aside{width:232px;padding:20px 14px;background:var(--side);backdrop-filter:blur(18px);border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:16px;padding:4px 10px 18px}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--pri),var(--em));display:grid;place-items:center;color:#fff;font-style:normal}
nav button{all:unset;display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--mut);cursor:pointer;width:100%;box-sizing:border-box;font-weight:500;transition:.2s}
nav button:hover{background:var(--bd);color:var(--tx)}
nav button.on{background:linear-gradient(135deg,var(--pri),var(--ind));color:#fff;box-shadow:0 6px 18px rgba(79,110,247,.35)}
.plan{margin-top:auto;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--bd);font-size:12px;color:var(--mut)}
main{flex:1;min-width:0;padding:0 28px 40px}
header{position:sticky;top:0;z-index:5;display:flex;gap:14px;align-items:center;padding:16px 0;background:linear-gradient(var(--bg) 60%,transparent);flex-wrap:wrap}
.cls{font-weight:700;font-size:17px}.cls small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.sp{flex:1}
.search{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:var(--card);border:1px solid var(--bd);min-width:220px;backdrop-filter:blur(12px)}
.search input{all:unset;flex:1;color:var(--tx)}
.ib{all:unset;cursor:pointer;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--bd);position:relative;backdrop-filter:blur(12px)}
.ib b{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.user{display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);backdrop-filter:blur(16px);padding:18px;transition:.25s}
.card:hover{transform:translateY(-2px)}
h2{margin:6px 0 14px;font-size:22px}h3{margin:0 0 4px;font-size:14px}
.sub{color:var(--mut);font-size:12px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:2fr 1fr}.gc{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:6px 0 2px}
.kpi .d{font-size:12px;font-weight:600}.up{color:var(--em)}.dn{color:var(--red)}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.tabs{display:inline-flex;padding:4px;border-radius:12px;background:var(--bd);gap:2px;margin-bottom:14px}
.tabs button{all:unset;cursor:pointer;padding:7px 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.al{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:14px;margin-bottom:8px;border:1px solid var(--bd)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pill{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.G{background:rgba(16,185,129,.15);color:var(--em)}.Y{background:rgba(245,158,11,.16);color:var(--warn)}.R{background:rgba(239,68,68,.15);color:var(--red)}
.cam{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#0b1030,#1b2559 60%,#0d3b3a);border:1px solid var(--bd)}
.cam::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 4px)}
.rec{position:absolute;top:12px;left:12px;color:#fff;font-size:11px;font-weight:700;display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:99px}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:p 1.2s infinite}@keyframes p{50%{opacity:.2}}
.box{position:absolute;border:2px solid;border-radius:6px;font-size:10px;color:#fff;transition:all 1.6s ease}
.box span{position:absolute;top:-17px;left:-2px;padding:1px 6px;border-radius:5px;font-weight:600;white-space:nowrap}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:10px;cursor:pointer;user-select:none}
td{padding:11px 10px;border-top:1px solid var(--bd)}tr.r{cursor:pointer}tr.r:hover td{background:var(--bd)}
.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden;min-width:70px}.bar i{display:block;height:100%;border-radius:9px}
.btn{all:unset;cursor:pointer;padding:9px 16px;border-radius:12px;font-weight:600;background:linear-gradient(135deg,var(--pri),var(--ind));color:#fff;box-shadow:0 6px 16px rgba(79,110,247,.3)}
.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.tg{width:42px;height:24px;border-radius:99px;background:var(--bd);position:relative;cursor:pointer;flex:none}.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}.tg.on{background:var(--em)}.tg.on::after{left:21px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--bd);gap:12px}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,80px);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:12px;font-weight:600;transition:.3s;z-index:20;opacity:0}#toast.s{transform:translate(-50%,0);opacity:1}
.ov{overflow-x:auto}.fade{animation:f .35s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media(max-width:820px){aside{width:64px;padding:16px 8px}aside .t,.logo span,.plan{display:none}.logo{padding:4px 6px 14px}main{padding:0 14px 40px}.g2{grid-template-columns:1fr}.user .nm{display:none}}
</style>
</head>
<body>
<div class="app">
<aside>
 <div class="logo"><i>◈</i><span>Cortex AI</span></div>
 <nav id="nav"></nav>
 <div class="plan"><b style="color:var(--tx)">Enterprise Plan</b><br>12 classrooms · 4 campuses<br><span class="up">● All systems operational</span></div>
</aside>
<main>
 <header>
  <div class="cls">Physics Lab · Room 204<small id="clock">Live session · Period 3</small></div>
  <div class="sp"></div>
  <label class="search">⌕ <input id="q" placeholder="Search students, reports…"></label>
  <button class="ib" id="theme" title="Toggle theme">◐</button>
  <button class="ib" id="bell" title="Notifications">🔔<b></b></button>
  <div class="user"><div class="av" style="background:linear-gradient(135deg,#6366f1,#10b981)">DA</div><div class="nm"><b>Dr. Adeyemi</b><div class="sub">Head of Faculty</div></div></div>
 </header>
 <div id="view" class="fade"></div>
</main>
</div>
<div id="toast"></div>
<script>
const $=(s,e=document)=>e.querySelector(s);
const NAV=[["dash","▦","Dashboard"],["stu","☺","Student Analytics"],["live","◉","Live Monitoring"],["rep","▤","Reports"],["set","⚙","Settings"]];
let page="dash",filter="",sort={k:"att",d:-1},tab="Daily",live=true;
const names=["Amara Okafor","Tunde Bello","Chioma Eze","Ibrahim Musa","Zainab Yusuf","Emeka Nwosu","Folake Adebayo","David Ojo","Ngozi Obi","Sola Martins","Kemi Lawal","Femi Coker"];
const cols=["#6366f1","#10b981","#4f6ef7","#8b5cf6","#0ea5e9","#14b8a6"];
const S=names.map((n,i)=>{const a=[94,88,91,72,65,58,83,77,49,86,69,92][i];return{id:"STU-"+(1001+i),n,att:a,pulse:68+((i*7)%22),eng:Math.max(30,a-8+((i*5)%14)),c:cols[i%6],tr:Array.from({length:10},(_,j)=>Math.max(20,Math.min(100,a+Math.round(Math.sin(i+j*1.3)*9))))}});
const st=a=>a>=80?["G","Highly Attentive"]:a>=60?["Y","Moderate"]:["R","Intervention"];
const T=["08:00","08:15","08:30","08:45","09:00","09:15","09:30","09:45","10:00","10:15","10:30","10:45"];
const D={att:[72,78,84,86,82,79,74,70,76,83,87,85],eng:[60,66,72,79,83,80,75,68,64,72,81,84],pul:[74,76,78,77,80,79,76,73,75,78,77,76]};
const beh=[["Attentive",18,"#10b981"],["Distracted",5,"#f59e0b"],["Sleepy",2,"#ef4444"],["Phone Use",3,"#6366f1"],["Writing",14,"#4f6ef7"]];
function pth(v,w,h,mn,mx,px=0){const p=v.map((y,i)=>[px+i*(w-2*px)/(v.length-1),h-(y-mn)/(mx-mn)*h]);let d=`M${p[0]}`;for(let i=1;i<p.length;i++){const[a,b]=[p[i-1],p[i]],m=(a[0]+b[0])/2;d+=` C${m},${a[1]} ${m},${b[1]} ${b[0]},${b[1]}`}return[d,p]}
let uid=0;
function line(v,{c="#4f6ef7",area=false,w=600,h=200,mn=50,mx=100,lab=T,mini=false}={}){const[d,p]=pth(v,w,h,mn,mx);const g="g"+uid++;let o=`<svg viewBox="0 0 ${w} ${mini?h:h+26}" preserveAspectRatio="none"><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".4"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>`;
if(!mini){for(let i=0;i<5;i++){const y=i*h/4;o+=`<line x1="0" x2="${w}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="0" y="${y-4}" fill="var(--mut)" font-size="10">${Math.round(mx-i*(mx-mn)/4)}</text>`}lab.forEach((t,i)=>{if(i%2==0)o+=`<text x="${p[i][0]}" y="${h+18}" fill="var(--mut)" font-size="10" text-anchor="middle">${t}</text>`})}
if(area||mini)o+=`<path d="${d} L${w},${h} L0,${h} Z" fill="url(#${g})"/>`;
o+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${mini?2:3}" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
if(!mini)p.forEach((q,i)=>o+=`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="var(--bg)" stroke="${c}" stroke-width="2"><title>${lab[i]}: ${v[i]}</title></circle>`);return o+"</svg>"}
function bars(){const w=600,h=200,m=22;let o=`<svg viewBox="0 0 ${w} ${h+26}">`;beh.forEach((b,i)=>{const bw=70,x=i*(w/5)+(w/5-bw)/2,bh=b[1]/20*h;o+=`<rect x="${x}" y="${h-bh}" width="${bw}" height="${bh}" rx="10" fill="${b[2]}" opacity=".9"><title>${b[0]}: ${b[1]}</title></rect><text x="${x+bw/2}" y="${h-bh-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--tx)">${b[1]}</text><text x="${x+bw/2}" y="${h+18}" text-anchor="middle" font-size="11" fill="var(--mut)">${b[0]}</text>`});return o+"</svg>"}
const kpi=(l,v,d,ic,c,u="")=>`<div class="card kpi"><div style="display:flex;justify-content:space-between"><span class="sub">${l}</span><div class="ico" style="background:${c}22;color:${c}">${ic}</div></div><div class="v">${v}<small style="font-size:14px;color:var(--mut)">${u}</small></div><div class="d ${d[0]=="-"?"dn":"up"}">${d[0]=="-"?"▼":"▲"} ${d.replace("-","")} <span class="sub" style="font-weight:400">vs last week</span></div></div>`;
const av=(s,z=34)=>`<div class="av" style="background:linear-gradient(135deg,${s.c},#10b981);width:${z}px;height:${z}px">${s.n.split(" ").map(x=>x[0]).join("")}</div>`;
const card=(t,sub,body,x="")=>`<div class="card chart ${x}"><h3>${t}</h3><div class="sub" style="margin-bottom:12px">${sub}</div>${body}</div>`;
const cam=()=>`<div class="cam" id="cam"><div class="rec"><i></i>LIVE · CAM-01</div>${[0,1,2,3,4,5].map(i=>`<div class="box" data-i="${i}"></div>`).join("")}<div style="position:absolute;bottom:10px;right:12px;color:#fff;font-size:11px;opacity:.7">YOLO26 · 30 FPS · 1080p</div></div>`;
const V={
dash(){const n=S.length;return`<h2>Classroom Overview</h2>
<div class="grid g4">${kpi("Overall Attention","84%","3.2%","◎","#4f6ef7")}${kpi("Alertness Score","79%","1.8%","⚡","#10b981")}${kpi("Engagement Score","81%","-0.9%","✦","#6366f1")}${kpi("Average Pulse","76","2%","♥","#ef4444"," BPM")}</div>
<div class="grid g2" style="margin-top:16px">${card("Classroom Attention Trend","Rolling average · today",line(D.att,{c:"#4f6ef7"}))}${card("Student Engagement Trend","Participation index · today",line(D.eng,{c:"#10b981",area:true}))}${card("Behavior Distribution","Students per detected behavior",bars())}${card("Pulse Trend Over Time","rPPG estimate · BPM",line(D.pul,{c:"#ef4444",mn:60,mx:90}))}</div>
<div class="grid g3" style="margin-top:16px"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><h3>Live Monitoring</h3><div class="sub">Room 204 · ${n} students active</div></div><button class="btn o" data-go="live">Open</button></div><div style="margin-top:12px">${cam()}</div>
<div class="grid g4" style="margin-top:12px;grid-template-columns:repeat(4,1fr)">${[["Faces",12,"#4f6ef7"],["Attentive",8,"#10b981"],["Distracted",3,"#f59e0b"],["Phones",1,"#ef4444"]].map(x=>`<div style="padding:10px;border-radius:12px;background:var(--bd)"><div class="sub">${x[0]}</div><b style="font-size:20px;color:${x[2]}" class="ls">${x[1]}</b></div>`).join("")}</div></div>
<div class="card"><h3>Teacher Alerts</h3><div class="sub" style="margin-bottom:12px">Real-time attention status</div>
${[["G","Highly Attentive",S.filter(s=>s.att>=80).length],["Y","Moderate Attention",S.filter(s=>s.att>=60&&s.att<80).length],["R","Intervention Needed",S.filter(s=>s.att<60).length]].map(a=>`<div class="al"><span class="dot" style="background:var(--${{G:"em",Y:"warn",R:"red"}[a[0]]})"></span><div style="flex:1"><b>${a[1]}</b></div><span class="pill ${a[0]}">${a[2]} students</span></div>`).join("")}
<div class="sub" style="margin:14px 0 8px">Needs attention now</div>${S.filter(s=>s.att<70).sort((a,b)=>a.att-b.att).slice(0,3).map(s=>`<div class="al" style="cursor:pointer" data-stu="${s.id}">${av(s,30)}<div style="flex:1"><b>${s.n}</b><div class="sub">${s.att}% attention</div></div><span class="pill ${st(s.att)[0]}">${st(s.att)[1]}</span></div>`).join("")}</div></div>`},
stu(){let r=S.filter(s=>(s.n+s.id).toLowerCase().includes(filter.toLowerCase())).sort((a,b)=>(a[sort.k]>b[sort.k]?1:-1)*sort.d);
const th=(k,l)=>`<th data-s="${k}">${l}${sort.k==k?(sort.d>0?" ↑":" ↓"):""}</th>`;
return`<h2>Student Analytics</h2><div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><h3>All Students</h3><div class="sub">${r.length} results · click headers to sort</div></div><button class="btn o" data-toast="CSV export started">Export CSV</button></div><div class="ov"><table><tr>${th("id","Student ID")}${th("n","Name")}${th("att","Attention %")}${th("pulse","Pulse")}${th("eng","Engagement")}<th>Status</th></tr>
${r.map(s=>`<tr class="r" data-stu="${s.id}"><td class="sub">${s.id}</td><td><div style="display:flex;gap:10px;align-items:center">${av(s,28)}<b>${s.n}</b></div></td><td><div style="display:flex;gap:8px;align-items:center"><b>${s.att}%</b><div class="bar"><i style="width:${s.att}%;background:var(--${{G:"em",Y:"warn",R:"red"}[st(s.att)[0]]})"></i></div></div></td><td>♥ ${s.pulse} BPM</td><td>${s.eng}</td><td><span class="pill ${st(s.att)[0]}">${st(s.att)[1]}</span></td></tr>`).join("")}</table></div></div>
<h2 style="margin-top:24px;font-size:18px">Student Cards</h2><div class="grid gc">${r.map(s=>`<div class="card" style="cursor:pointer" data-stu="${s.id}"><div style="display:flex;gap:12px;align-items:center">${av(s,46)}<div><b>${s.n}</b><div class="sub">${s.id}</div></div></div><div style="display:flex;justify-content:space-between;margin:14px 0 4px"><div><div class="sub">Attention</div><b style="font-size:22px">${s.att}%</b></div><div style="text-align:right"><div class="sub">Pulse</div><b style="font-size:22px">${s.pulse}</b></div></div><div style="height:46px">${line(s.tr,{c:s.att>=80?"#10b981":s.att>=60?"#f59e0b":"#ef4444",mini:true,w:200,h:46,mn:10,mx:105})}</div></div>`).join("")}</div>`},
live(){return`<h2>Live Monitoring</h2><div class="grid g3"><div class="card">${cam()}<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><select id="src" class="btn o"><option>Laptop Webcam</option><option>iPhone Stream</option><option>CCTV RTSP</option></select><button class="btn" data-toast="Monitoring started">▶ Start</button><button class="btn o" data-toast="Monitoring stopped">⏹ Stop</button></div></div>
<div class="card"><h3>Detection Statistics</h3><div class="sub" style="margin-bottom:12px">Updates every 3 seconds</div><div style="font-size:42px;font-weight:700" id="act">12</div><div class="sub" style="margin-bottom:14px">Active students</div>${beh.map(b=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><span>${b[0]}</span><b class="ls">${b[1]}</b></div><div class="bar"><i style="width:${b[1]/20*100}%;background:${b[2]}"></i></div></div>`).join("")}</div></div>`},
rep(){const p={Daily:"Today · 27 Oct 2026",Weekly:"Week 43 · 19–25 Oct",Monthly:"September 2026"}[tab],m={Daily:[84,79,81],Weekly:[81,77,80],Monthly:[79,75,78]}[tab];
return`<h2>Reports</h2><div class="tabs">${["Daily","Weekly","Monthly"].map(t=>`<button data-tab="${t}" class="${t==tab?"on":""}">${t} Report</button>`).join("")}</div>
<div class="grid g4" style="grid-template-columns:repeat(3,1fr)">${kpi("Avg Attention",m[0]+"%","2.1%","◎","#4f6ef7")}${kpi("Avg Alertness",m[1]+"%","1.2%","⚡","#10b981")}${kpi("Avg Engagement",m[2]+"%","-0.4%","✦","#6366f1")}</div>
<div class="grid g3" style="margin-top:16px">${card(tab+" Attention Summary",p,line(tab=="Daily"?D.att:D.att.map((v,i)=>v+(i%3)-1),{c:"#6366f1",area:true}))}<div class="card"><h3>Export</h3><div class="sub" style="margin-bottom:14px">${p}</div><div style="display:grid;gap:10px"><button class="btn" data-toast="PDF export started">⤓ Export PDF</button><button class="btn o" data-toast="CSV export started">⤓ Export CSV</button><button class="btn o" data-toast="Scheduled to email weekly">✉ Schedule email</button></div></div></div>`},
set(){const o=[["Teacher alerts","Notify when attention drops below 60%",1],["Pulse (rPPG) tracking","Estimate heart rate from video",1],["Phone-use detection","Flag devices in view",1],["Anonymize faces","Blur identities in saved footage",0],["Auto weekly report","Email summaries every Friday",1]];
return`<h2>Settings</h2><div class="card" style="max-width:640px"><h3>Preferences</h3>${o.map(x=>`<div class="row"><div><b>${x[0]}</b><div class="sub">${x[1]}</div></div><div class="tg ${x[2]?"on":""}"></div></div>`).join("")}<div class="row"><div><b>Appearance</b><div class="sub">Switch between light and dark</div></div><button class="btn o" id="t2">Toggle theme</button></div></div>`}};
function toast(m){const t=$("#toast");t.textContent=m;t.className="s";clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",2200)}
function nav(){$("#nav").innerHTML=NAV.map(n=>`<button data-p="${n[0]}" class="${n[0]==page?"on":""}"><span>${n[1]}</span><span class="t">${n[2]}</span></button>`).join("")}
function boxes(){const c=["#10b981","#10b981","#f59e0b","#10b981","#ef4444","#6366f1"],l=["Attentive","Attentive","Distracted","Writing","Sleepy","Phone"];document.querySelectorAll(".box").forEach(b=>{const i=+b.dataset.i;b.style.left=(5+(i%3)*31+Math.random()*8)+"%";b.style.top=(12+Math.floor(i/3)*42+Math.random()*8)+"%";b.style.width="20%";b.style.height="34%";b.style.borderColor=c[i];b.style.background=c[i]+"18";b.innerHTML=`<span style="background:${c[i]}">${l[i]} ${(85+Math.random()*14|0)}%</span>`})}
function render(){nav();const v=$("#view");v.innerHTML=V[page]();v.className="";void v.offsetWidth;v.className="fade";if($("#cam"))boxes();scrollTo(0,0)}
function go(p){page=p;render()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-p],[data-go],[data-s],[data-tab],[data-toast],[data-stu],.tg,#t2");if(!t)return;
if(t.dataset.p)go(t.dataset.p);else if(t.dataset.go)go(t.dataset.go);
else if(t.dataset.s){sort={k:t.dataset.s,d:sort.k==t.dataset.s?-sort.d:-1};render()}
else if(t.dataset.tab){tab=t.dataset.tab;render()}
else if(t.dataset.toast)toast(t.dataset.toast);
else if(t.dataset.stu){const s=S.find(x=>x.id==t.dataset.stu);toast(s.n+" · "+s.att+"% attention · "+s.pulse+" BPM")}
else if(t.classList.contains("tg"))t.classList.toggle("on");
else if(t.id=="t2")theme()});
function theme(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark";try{localStorage.setItem("th",r.dataset.theme)}catch(e){}}
$("#theme").onclick=theme;$("#bell").onclick=()=>{$("#bell b").remove();toast("3 students need intervention in Room 204")};
$("#q").oninput=e=>{filter=e.target.value;if(page!="stu")page="stu";render();const q=$("#q");q.focus()};
try{const t=localStorage.getItem("th");if(t)document.documentElement.dataset.theme=t}catch(e){}
setInterval(()=>{if(document.querySelector(".box"))boxes();document.querySelectorAll(".ls").forEach(e=>{const v=+e.textContent;if(!isNaN(v))e.textContent=Math.max(0,v+(Math.random()<.3?(Math.random()<.5?-1:1):0))})},3000);
render();
</script>
</body>
</html>
